<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to Webtellisense | Immediate Onboarding</title>
  <link href="assets/css/main.css" rel="stylesheet">
  <style>
    .welcome-container { max-width: 800px; margin: 60px auto; padding: 30px; background: #fff; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
    .welcome-header { text-align: center; margin-bottom: 30px; }
    .welcome-badge { background: #dcfce7; color: #15803d; padding: 6px 16px; border-radius: 20px; font-weight: 700; font-size: 0.85rem; }
    .form-embed-wrapper { width: 100%; min-height: 500px; border: none; border-radius: 12px; }
  </style>
</head>
<body style="background:#f8fafc;">

  <div class="welcome-container" id="gate-container">
    <!-- Unverified Visitor Access Denied Guard -->
    <div id="unauthorized-msg" style="display:none; text-align:center;">
      <h2>Access Denied</h2>
      <p>This onboarding hub is only accessible following an active package activation.</p>
      <a href="/packages.html" class="btn btn-primary">View Packages</a>
    </div>

    <!-- Verified Client View -->
    <div id="client-onboarding-view" style="display:none;">
      <div class="welcome-header">
        <span class="welcome-badge">✓ Payment Confirmed</span>
        <h1 class="mt-3">Welcome Aboard, <span id="client-first-name">Partner</span>! 🎉</h1>
        <p>Let's kick off your project immediately. Please complete the quick onboarding form below so our technical team can start work.</p>
      </div>

      <!-- Embedded Interactive Questionnaire (Tally / Typeform) -->
      <iframe id="tally-onboarding-frame" class="form-embed-wrapper" src="https://tally.so/r/3yD4kx?transparentBackground=1"></iframe>
    </div>
  </div>

  <script>
    // URL Session Validation Security Script
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const sessionId = urlParams.get('session_id');

      if (!sessionId) {
        document.getElementById('unauthorized-msg').style.display = 'block';
        return;
      }

      try {
        const decodedData = JSON.parse(atob(sessionId));
        
        if (decodedData.ref && decodedData.name) {
          document.getElementById('client-onboarding-view').style.display = 'block';
          document.getElementById('client-first-name').innerText = decodedData.name.split(' ')[0];
          
          // Optionally pass parameters to embedded questionnaire URL
          const frame = document.getElementById('tally-onboarding-frame');
          frame.src = `https://tally.so/r/3yD4kx?name=${encodeURIComponent(decodedData.name)}&email=${encodeURIComponent(decodedData.email)}&pkg=${encodeURIComponent(decodedData.pkg)}`;
        } else {
          document.getElementById('unauthorized-msg').style.display = 'block';
        }
      } catch (e) {
        document.getElementById('unauthorized-msg').style.display = 'block';
      }
    });
  </script>
</body>
</html>
